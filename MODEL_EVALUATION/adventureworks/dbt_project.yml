

name: 'adventureworks'
version: '1.0.0'

profile: 'adventureworks'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  adventureworks:
    raw:
      +materialized: table
      +schema: raw
    staging:
      +materialized: view
      +schema: staging
      sales:
        +schema: staging_sales
      production:
        +schema: staging_production
      person:
        +schema: staging_person
    dimensions:
      +materialized: incremental
      +schema: dimensions
    facts:
      +materialized: incremental
      +schema: facts
