version: 2

models:
  - name: stg_sales__sales_order_detail
    description: >
      Staged SalesOrderDetail source data — typed, hashed, and prepared for downstream
      Internet Sales facts. Includes SCD Type 2 metadata columns for change tracking.
    columns:
      - name: sales_order_detail_hk
        description: Hash key derived from the composite business key (sales_order_id, sales_order_detail_id).
        data_tests:
          - not_null
          - unique
      - name: sales_order_detail_hashdiff
        description: Hashdiff across all SalesOrderDetail business columns for row change detection.
        data_tests:
          - not_null
      - name: sales_order_id
        description: Foreign key to SalesOrderHeader.
        data_tests:
          - not_null
      - name: sales_order_detail_id
        description: Surrogate line identifier within a sales order. Maps to SalesOrderLineNumber in FactInternetSales.
        data_tests:
          - not_null
          - unique
      - name: product_id
        description: Foreign key to Product (maps to DimProduct.ProductKey in DW).
        data_tests:
          - not_null
      - name: special_offer_id
        description: Foreign key to SpecialOffer (maps to DimPromotion.PromotionKey in DW).
        data_tests:
          - not_null
      - name: order_qty
        data_tests:
          - not_null
      - name: unit_price
        data_tests:
          - not_null
      - name: line_total
        data_tests:
          - not_null
      - name: effective_start_date
        data_tests:
          - not_null
      - name: effective_end_date
        data_tests:
          - not_null
      - name: is_current
        data_tests:
          - not_null

  - name: stg_sales__sales_order_header
