        data_tests:
          - not_null
      - name: sales_order_id
        data_tests:
          - not_null
          - unique
      - name: sales_order_number
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: order_date_key
        data_tests:
          - not_null
      - name: due_date_key
        data_tests:
          - not_null
      - name: effective_start_date
        data_tests:
          - not_null
      - name: effective_end_date
        data_tests:
          - not_null
      - name: is_current
        data_tests:
          - not_null

