version: 2

models:
  - name: stg_person__person
    description: Staged Person source data — typed, hashed, and SCD2-ready. Maps to DimCustomer in DW.
    columns:
      - name: person_hk
        description: Hash key derived from business_entity_id.
        data_tests:
          - not_null
          - unique
      - name: person_hashdiff
        data_tests:
          - not_null
      - name: business_entity_id
        data_tests:
          - not_null
          - unique
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: effective_start_date
        data_tests:
          - not_null
      - name: effective_end_date
        data_tests:
          - not_null
      - name: is_current
        data_tests:
          - not_null

  - name: stg_person__email_address
    description: Staged EmailAddress data — typed, hashed, and SCD2-ready.
    columns:
      - name: email_address_hk
        description: Hash key derived from composite key (business_entity_id, email_address_id).
        data_tests:
          - not_null
          - unique
      - name: email_address_hashdiff
        data_tests:
          - not_null
      - name: business_entity_id
        data_tests:
          - not_null
      - name: email_address_id
        data_tests:
          - not_null
      - name: email_address
        data_tests:
          - not_null
      - name: effective_start_date
        data_tests:
          - not_null
      - name: effective_end_date
        data_tests:
          - not_null
      - name: is_current
        data_tests:
          - not_null

