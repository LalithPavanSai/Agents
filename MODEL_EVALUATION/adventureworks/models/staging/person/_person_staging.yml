        description: Hash key derived from composite key (business_entity_id, phone_number, phone_number_type_id).
        data_tests:
          - not_null
          - unique
      - name: person_phone_hashdiff
        data_tests:
          - not_null
      - name: business_entity_id
        data_tests:
          - not_null
      - name: phone_number
        data_tests:
          - not_null
      - name: phone_number_type_id
        data_tests:
          - not_null
      - name: effective_start_date
        data_tests:
          - not_null
      - name: effective_end_date
        data_tests:
          - not_null
      - name: is_current
        data_tests:
